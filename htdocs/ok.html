<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الدفع بنجاح | SwiftPayIQ</title>
    <!-- خط Cairo من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #10B981;
            --primary-hover: #059669;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --whatsapp-green: #25D366;
            --swiftpay-color: #1E3A8A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 40px 28px;
            text-align: center;
            position: relative;
            border: 1px solid #F1F5F9;
        }

        /* تحريك أيقونة النجاح */
        .icon-container {
            width: 88px;
            height: 88px;
            background-color: #D1FAE5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            animation: pulse 1.8s infinite;
        }

        .icon-container svg {
            width: 48px;
            height: 48px;
            color: var(--primary-color);
            animation: scaleUp 0.4s ease-out;
        }

        h1 {
            color: var(--text-main);
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* تنبيه إرسال الواتساب */
        .whatsapp-alert {
            background-color: #F0FDF4;
            border: 1px solid #BBF7D0;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #166534;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .whatsapp-alert svg {
            width: 20px;
            height: 20px;
            fill: var(--whatsapp-green);
            flex-shrink: 0;
        }

        /* عرض رقم العملية تلقائياً إن وجد */
        .txn-box {
            display: none;
            background-color: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .txn-box strong {
            color: var(--text-main);
            direction: ltr;
            display: inline-block;
        }

        /* الشريك الرسمي */
        .partner-footer {
            margin-bottom: 24px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .partner-footer strong {
            color: var(--swiftpay-color);
            font-weight: 800;
        }

        /* الأزرار */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #F1F5F9;
        }

        /* Animations */
        @keyframes scaleUp {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.3); }
            70% { box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @media print {
            body { background: none; }
            .card { box-shadow: none; border: 1px solid #ccc; }
            .actions { display: none; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- أيقونة النجاح -->
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <!-- العناوين -->
        <h1>تمت عملية الدفع بنجاح</h1>
        <p class="subtitle">شكراً لك! تم استلام دفعتك وتأكيد طلبك بنجاح.</p>

        <!-- تنبيه الواتساب -->
        <div class="whatsapp-alert">
            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
            </svg>
            <span>تم إرسال تفاصيل الخدمة والفاتورة إلى حسابك في واتساب.</span>
        </div>

        <!-- عرض رقم العملية إختيارياً إذا كان ممرراً في URL -->
        <div id="txnContainer" class="txn-box">
            رقم العملية: <strong id="txnId"></strong>
        </div>

        <!-- إشعار الشريك الرسمي -->
        <div class="partner-footer">
            <span>بوابة دفع آمنة بواسطة الشريك الرسمي</span>
            <strong>SwiftPayIQ</strong>
        </div>

        <!-- الأزرار -->
        <div class="actions">
            <a href="https://krar.top" class="btn btn-primary">العودة للرئيسية</a>
            <button onclick="window.print()" class="btn btn-secondary">طباعة الإيصال</button>
        </div>
    </div>

    <script>
        // قراءة معرف العملية تلقائياً إذا كان ممرراً عبر SwiftPayIQ (?txn_id=XXXX)
        const urlParams = new URLSearchParams(window.location.search);
        const txnId = urlParams.get('txn_id');
        if (txnId) {
            document.getElementById('txnId').textContent = '#' + txnId;
            document.getElementById('txnContainer').style.display = 'block';
        }
    </script>

</body>
</html>
